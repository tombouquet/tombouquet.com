[install]
linker = "isolated"
exact = true
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  "@tombouquet/oxlint-config",
  "@tombouquet/oxfmt-config",
  "@tombouquet/format-codemod",
  "@tombouquet/commitlint-config",
  "@tombouquet/tsconfig",
]

[install.scopes]
"@tombouquet" = { url = "https://npm.pkg.github.com", token = "$GITHUB_TOKEN" }
